<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RWND | Wellness Connected</title>

<style>
:root {
  --green: #20392e;
  --cream: #f7f5ef;
  --sage: #e6ebe2;
  --gold: #c9a889;
  --text: #263b30;
  --muted: #78847b;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #e9ede6;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont,
    "Segoe UI", Arial, sans-serif;
}

.app {
  max-width: 480px;
  min-height: 100vh;
  margin: auto;
  background: var(--cream);
  padding-bottom: 95px;
}

header {
  padding: 30px 22px 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-family: Georgia, serif;
  font-size: 32px;
  letter-spacing: 3px;
}

.avatar {
  background: #e8d8c8;
  border-radius: 50%;
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  font-size: 22px;
}

main {
  padding: 12px 22px;
}

h1 {
  font-family: Georgia, serif;
  font-size: 30px;
  font-weight: normal;
  margin: 12px 0;
}

h2 {
  font-family: Georgia, serif;
  font-size: 23px;
  font-weight: normal;
}

p {
  line-height: 1.6;
}

.subtitle {
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 25px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 15px;
  border: 1px solid #e8e7e1;
}

.card h3 {
  margin-top: 0;
}

.highlight {
  background: linear-gradient(
    120deg,
    #e3e9df,
    #f0e2d5
  );
}

.metric {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid #eeeeea;
}

.metric:last-child {
  border-bottom: none;
}

.value {
  font-weight: bold;
}

.progress {
  height: 8px;
  background: #e8ece6;
  border-radius: 10px;
  margin: 12px 0;
  overflow: hidden;
}

.progress div {
  height: 100%;
  background: #6b9a79;
  border-radius: 10px;
}

button {
  cursor: pointer;
  font-family: inherit;
}

.primary {
  background: var(--green);
  color: white;
  border: none;
  padding: 13px 20px;
  border-radius: 30px;
  font-weight: 600;
  margin-top: 10px;
  min-height: 44px;
}

.secondary {
  background: #e8eee7;
  color: var(--green);
  border: none;
  padding: 12px 16px;
  border-radius: 30px;
  font-weight: 600;
  min-height: 44px;
}

.device {
  display: flex;
  gap: 15px;
  align-items: center;
}

.device-icon {
  font-size: 35px;
  background: #eef0eb;
  border-radius: 15px;
  padding: 15px;
}

.device-info {
  flex: 1;
}

.device-info h3 {
  margin: 0 0 5px;
  font-size: 15px;
}

.device-info p {
  margin: 0;
  font-size: 12px;
  color: var(--muted);
}

.device button {
  border: none;
  background: none;
  font-size: 25px;
  color: var(--green);
  min-width: 44px;
  min-height: 44px;
}

nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: white;
  display: flex;
  justify-content: space-around;
  padding: 12px 4px 22px;
  border-top: 1px solid #e5e5df;
  z-index: 100;
}

nav button {
  border: none;
  background: none;
  color: #8b958e;
  font-size: 11px;
  min-width: 58px;
  min-height: 48px;
}

nav button span {
  display: block;
  font-size: 22px;
  margin-bottom: 4px;
}

nav button.active {
  color: var(--green);
  font-weight: bold;
}

input, select {
  width: 100%;
  padding: 14px;
  border: 1px solid #e0e5df;
  border-radius: 12px;
  font-size: 16px;
  margin: 8px 0;
}

.chat {
  background: #edf1eb;
  padding: 15px;
  border-radius: 15px;
  margin-bottom: 12px;
  font-size: 14px;
}

.chat.user {
  background: var(--green);
  color: white;
  margin-left: 35px;
}

.chat-row {
  display: flex;
  gap: 8px;
}

.chat-row input {
  flex: 1;
  min-width: 0;
}

.chat-row button {
  flex-shrink: 0;
}

.product {
  text-align: center;
}

.product-icon {
  font-size: 60px;
  margin: 15px;
}

.price {
  font-size: 23px;
  font-weight: bold;
}

.notice {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.6;
}

#notification {
  position: fixed;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--green);
  color: white;
  padding: 14px 20px;
  border-radius: 14px;
  display: none;
  z-index: 200;
  width: max-content;
  max-width: 90%;
  text-align: center;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">RWND</div>
  <div class="avatar">✦</div>
</header>

<main id="content">

  <h1>Good morning ☀️</h1>
  <p class="subtitle">
    Your wellness journey starts here.
  </p>

  <div class="card">
    <h2>Today's Progress</h2>
    <p>💧 Hydration: 1.8 / 2.5 L</p>
    <p>🥗 Nutrition: 1,450 kcal</p>
    <p>🏃 Activity: 7,800 steps</p>
  </div>

  <div class="card highlight">
    <h2>Your AI Concierge ✦</h2>
    <p>
      Personalized wellness guidance,
      connected devices and expert support.
    </p>
  </div>

</main>

<nav>
  <button id="nav-home" class="active"
    onclick="navigate('home')">
    <span>⌂</span>Home
  </button>

  <button id="nav-track"
    onclick="navigate('track')">
    <span>◫</span>Track
  </button>

  <button id="nav-concierge"
    onclick="navigate('concierge')">
    <span>✦</span>Concierge
  </button>

  <button id="nav-connect"
    onclick="navigate('connect')">
    <span>♧</span>Connect
  </button>

  <button id="nav-shop"
    onclick="navigate('shop')">
    <span>▣</span>Shop
  </button>
</nav>

</div>

<div id="notification"></div>

<script>

"use strict";

let water = 1.8;
let cart = 0;
let currentPage = "home";
let chatHistory = [];

function notify(message) {
  const box = document.getElementById("notification");

  box.textContent = message;
  box.style.display = "block";

  setTimeout(function() {
    box.style.display = "none";
  }, 2500);
}

function navigate(page) {
  currentPage = page;

  document.querySelectorAll("nav button").forEach(
    function(button) {
      button.classList.remove("active");
    }
  );

  const selected = document.getElementById("nav-" + page);

  if (selected) {
    selected.classList.add("active");
  }

  const content = document.getElementById("content");

  if (page === "home") {
    content.innerHTML = homePage();
  }

  if (page === "track") {
    content.innerHTML = trackPage();
  }

  if (page === "concierge") {
    content.innerHTML = conciergePage();
  }

  if (page === "connect") {
    content.innerHTML = connectPage();
  }

  if (page === "shop") {
    content.innerHTML = shopPage();
  }

  window.scrollTo(0, 0);
}

function homePage() {
  return `
    <h1>Good morning ☀️</h1>

    <p class="subtitle">
      Your healthier day starts here.
    </p>

    <div class="card">
      <h2>Today's Progress</h2>

      <div class="metric">
        <span>💧 Hydration</span>
        <span class="value">${water.toFixed(2)} / 2.5 L</span>
      </div>

      <div class="progress">
        <div style="width:${Math.min(100, water / 2.5 * 100)}%"></div>
      </div>

      <div class="metric">
        <span>🥗 Nutrition</span>
        <span class="value">1,450 kcal</span>
      </div>

      <div class="metric">
        <span>🏃 Activity</span>
        <span class="value">7,800 steps</span>
      </div>
    </div>

    <div class="card highlight">
      <h2>Your AI Concierge ✦</h2>

      <p>
        Understand your wellness data and
        receive personalized recommendations.
      </p>

      <button class="primary"
        onclick="navigate('concierge')">
        Talk to your Concierge →
      </button>
    </div>

    <h2>Today's Plan</h2>

    <div class="card">
      <h3>💧 Stay Hydrated</h3>
      <p>Keep progressing toward your daily goal.</p>

      <button class="secondary" onclick="addWater()">
        + Log 250 ml
      </button>
    </div>

    <div class="card">
      <h3>🥗 Eat Well</h3>
      <p>Explore healthy meal preparation.</p>

      <button class="secondary"
        onclick="navigate('connect')">
        Explore Meals
      </button>
    </div>

    <div class="card">
      <h3>🏋️ Stay Active</h3>
      <p>Connect with your personal trainer.</p>

      <button class="secondary"
        onclick="navigate('connect')">
        My Experts
      </button>
    </div>
  `;
}

function addWater() {
  water = Math.round((water + 0.25) * 100) / 100;

  notify("250 ml added successfully");

  navigate(currentPage);
}

function trackPage() {
  return `
    <h1>Track Your Wellness</h1>

    <p class="subtitle">
      All your smart wellness devices in one place.
    </p>

    <div class="card device">
      <div class="device-icon">💧</div>

      <div class="device-info">
        <h3>Smart Hydration Bottle</h3>
        <p>${water.toFixed(2)} / 2.5 L today</p>
        <p>SGUAI integration concept</p>
      </div>

      <button onclick="deviceDetails('hydration')">›</button>
    </div>

    <div class="card device">
      <div class="device-icon">🥣</div>

      <div class="device-info">
        <h3>Smart Nutrition Scale</h3>
        <p>1,450 kcal recorded</p>
        <p>Feelfit integration concept</p>
      </div>

      <button onclick="deviceDetails('nutrition')">›</button>
    </div>

    <div class="card device">
      <div class="device-icon">⚖️</div>

      <div class="device-info">
        <h3>Body Composition Scale</h3>
        <p>56.8 kg</p>
        <p>Feelfit integration concept</p>
      </div>

      <button onclick="deviceDetails('body')">›</button>
    </div>

    <div class="card device">
      <div class="device-icon">📏</div>

      <div class="device-info">
        <h3>Smart Measuring Tape</h3>
        <p>Waist: 68 cm</p>
        <p>Feelfit integration concept</p>
      </div>

      <button onclick="deviceDetails('tape')">›</button>
    </div>

    <div class="card highlight">
      <h3>Connected Data</h3>

      <p>
        RWND will display essential wellness
        metrics without recreating the full
        manufacturer applications.
      </p>
    </div>

    <p class="notice">
      Device readings are simulated.
      Bluetooth and manufacturer integrations
      are not yet active.
    </p>
  `;
}

function deviceDetails(device) {
  const content = document.getElementById("content");

  let details = "";

  if (device === "hydration") {
    details = `
      <h1>Smart Hydration Bottle</h1>

      <div class="card">
        <h2>Today's Hydration</h2>

        <div class="price">
          ${water.toFixed(2)} L
        </div>

        <p>Daily goal: 2.5 L</p>

        <div class="progress">
          <div style="width:${Math.min(100, water / 2.5 * 100)}%"></div>
        </div>

        <button class="primary" onclick="addWater()">
          + Add 250 ml
        </button>
      </div>

      <div class="card">
        <h3>💧 Smart Reminders</h3>
        <p>Personalized hydration reminders.</p>

        <h3>🔋 Bottle Battery</h3>
        <p>80% — simulated</p>
      </div>
    `;
  }

  if (device === "nutrition") {
    details = `
      <h1>Nutrition Overview</h1>

      <div class="card">
        <h2>Daily Calories</h2>
        <div class="price">1,450 kcal</div>

        <p>Daily goal: 2,200 kcal</p>

        <div class="metric">
          <span>Protein</span><b>90 g</b>
        </div>

        <div class="metric">
          <span>Carbohydrates</span><b>165 g</b>
        </div>

        <div class="metric">
          <span>Fat</span><b>48 g</b>
        </div>
      </div>
    `;
  }

  if (device === "body") {
    details = `
      <h1>Body Composition</h1>

      <div class="card">
        <h2>Body Weight</h2>
        <div class="price">56.8 kg</div>

        <div class="metric">
          <span>Body Fat</span><b>23%</b>
        </div>

        <div class="metric">
          <span>Muscle Mass</span><b>38.2 kg</b>
        </div>

        <div class="metric">
          <span>Body Water</span><b>52%</b>
        </div>
      </div>
    `;
  }

  if (device === "tape") {
    details = `
      <h1>Body Measurements</h1>

      <div class="card">
        <div class="metric">
          <span>Waist</span><b>68 cm</b>
        </div>

        <div class="metric">
          <span>Hips</span><b>94 cm</b>
        </div>

        <div class="metric">
          <span>Chest</span><b>86 cm</b>
        </div>

        <div class="metric">
          <span>Arm</span><b>28 cm</b>
        </div>
      </div>
    `;
  }

  content.innerHTML = `
    <button class="secondary"
      onclick="navigate('track')">
      ← Back to Track
    </button>

    ${details}

    <p class="notice">
      Demo measurements only.
      Live device synchronization is not enabled.
    </p>
  `;

  window.scrollTo(0, 0);
}

function conciergePage() {
  let history = chatHistory.map(function(message) {
    return `
      <div class="chat ${message.role}">
        ${escapeHTML(message.text)}
      </div>
    `;
  }).join("");

  return `
    <h1>RWND AI Concierge ✦</h1>

    <p class="subtitle">
      Your personal wellness companion.
    </p>

    <div class="card highlight">
      <h2>Hello! I'm your RWND Concierge.</h2>

      <p>
        I can help you understand your wellness
        dashboard, hydration, nutrition and
        professional support.
      </p>
    </div>

    <div class="card">
      <h3>Suggested Questions</h3>

      <button class="secondary"
        onclick="askConcierge('How is my progress?')">
        My Progress
      </button>

      <button class="secondary"
        onclick="askConcierge('Help with hydration')">
        Hydration
      </button>

      <button class="secondary"
        onclick="askConcierge('Suggest a healthy meal')">
        Nutrition
      </button>
    </div>

    <div id="chat-history">${history}</div>

    <div class="chat-row">
      <input
        id="chat-input"
        placeholder="Ask your Concierge..."
        onkeydown="if(event.key==='Enter') sendMessage()"
      >

      <button class="primary" onclick="sendMessage()">
        Send
      </button>
    </div>

    <p class="notice">
      This is a scripted demonstration.
      Live AI services are not connected.
    </p>
  `;
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, function(c) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[c];
  });
}

function sendMessage() {
  const input = document.getElementById("chat-input");

  if (!input) return;

  const question = input.value.trim();

  if (!question) return;

  askConcierge(question);
}

function askConcierge(question) {
  chatHistory.push({
    role: "user",
    text: question
  });

  let answer = "";
  const q = question.toLowerCase();

  if (q.includes("water") || q.includes("hydrat")) {
    answer =
      "You have recorded " + water.toFixed(2) +
      " liters of water today. Your daily goal is 2.5 liters. " +
      "You can review your hydration progress in Track.";
  } else if (
    q.includes("food") ||
    q.includes("meal") ||
    q.includes("nutrition")
  ) {
    answer =
      "Your sample nutrition dashboard shows 1,450 kcal today. " +
      "You can explore balanced meal options or connect with a dietitian.";
  } else if (
    q.includes("trainer") ||
    q.includes("dietitian") ||
    q.includes("expert")
  ) {
    answer =
      "Visit Connect to explore personal trainers, dietitians " +
      "and wellness professionals.";
  } else {
    answer =
      "Your current demo dashboard shows hydration at " +
      Math.round(water / 2.5 * 100) +
      "% of your daily goal, 1,450 kcal recorded and 7,800 steps. " +
      "Would you like to focus on hydration, nutrition or activity?";
  }

  chatHistory.push({
    role: "assistant",
    text: answer
  });

  navigate("concierge");
}

function connectPage() {
  return `
    <h1>RWND Connect</h1>

    <p class="subtitle">
      Your wellness network, connected.
    </p>

    <div class="card">
      <h2>🏋️ Personal Trainers</h2>

      <p>
        Connect with your own trainer or
        discover RWND fitness partners.
      </p>

      <button class="primary"
        onclick="notify('Trainer booking demo')">
        Explore Trainers
      </button>
    </div>

    <div class="card">
      <h2>🥗 Dietitians</h2>

      <p>
        Get personalized nutrition guidance
        from qualified professionals.
      </p>

      <button class="primary"
        onclick="notify('Dietitian booking demo')">
        Find a Dietitian
      </button>
    </div>

    <div class="card">
      <h2>🧘 Wellness Centers</h2>

      <p>
        Explore wellness programs and
        professional consultations.
      </p>

      <button class="primary"
        onclick="notify('Wellness center demo')">
        Explore Centers
      </button>
    </div>

    <div class="card highlight">
      <h2>🍱 Healthy Meal Prep</h2>

      <p>
        Discover nutritious meals from
        RWND's future meal preparation partners.
      </p>

      <button class="primary"
        onclick="showMeals()">
        Explore Meals
      </button>
    </div>
  `;
}

function showMeals() {
  document.getElementById("content").innerHTML = `
    <button class="secondary"
      onclick="navigate('connect')">
      ← Back
    </button>

    <h1>Healthy Meal Prep</h1>

    <div class="card">
      <h2>🥗 Grilled Chicken Bowl</h2>
      <p>High-protein balanced meal</p>
      <p class="price">$8.50</p>

      <button class="primary"
        onclick="notify('Added to demo order')">
        Add Meal
      </button>
    </div>

    <div class="card">
      <h2>🥑 Green Protein Bowl</h2>
      <p>Vegetarian protein-rich meal</p>
      <p class="price">$7.50</p>

      <button class="primary"
        onclick="notify('Added to demo order')">
        Add Meal
      </button>
    </div>

    <p class="notice">
      Example meals only. Ordering is not live.
    </p>
  `;
}

function shopPage() {
  return `
    <h1>RWND Shop</h1>

    <p class="subtitle">
      Smart wellness essentials.
    </p>

    <div class="card highlight">
      <h2>The RWND Collection</h2>
      <p>
        Discover connected wellness products
        designed for your daily routine.
      </p>
    </div>

    ${productCard("💧", "Smart Hydration Bottle", 99)}

    ${productCard("🥣", "Smart Nutrition Scale", 69)}

    ${productCard("⚖️", "Smart Body Scale", 79)}

    ${productCard("📏", "Smart Measuring Tape", 59)}

    <div class="card">
      <h2>RWND+ Premium</h2>

      <p>Personalized wellness support.</p>

      <div class="price">$9.99/month</div>

      <button class="primary"
        onclick="notify('Subscription demo only')">
        Explore RWND+
      </button>
    </div>

    <div class="card">
      <h2>🛒 Your Cart</h2>

      <p id="cart-count">
        ${cart} items
      </p>

      <button class="primary"
        onclick="notify('Checkout is not active in this demo')">
        Checkout
      </button>
    </div>

    <p class="notice">
      Prices are illustrative.
      No purchases or payments are processed.
    </p>
  `;
}

function productCard(icon, name, price) {
  return `
    <div class="card product">
      <div class="product-icon">${icon}</div>

      <h3>${name}</h3>

      <div class="price">$${price}</div>

      <button class="primary" onclick="addCart()">
        Add to Cart +
      </button>
    </div>
  `;
}

function addCart() {
  cart++;

  notify("Product added to cart");

  navigate("shop");
}

/* Start the interactive application */
navigate("home");

</script>

</body>
</html>
